# ruby2shell — CVE-2026-132825 / GHSA-34m4-m9fh-gqp5
# ModSecurity v3 (libmodsecurity) rules, IDs 2202611010 and 2202611020.
# Disruptive action on the chain starter, as v3 requires.
# Requires SecRequestBodyAccess On and multipart parsing (the default).
#
# The rules inspect multipart form data: a part whose headers declare an
# affected single-byte charset and whose value carries enough sharp-s (0xDF)
# bytes to overflow the case-conversion buffer. Charset matching covers every
# name Ruby accepts for these encodings; the value test counts 0xDF
# occurrences rather than a consecutive run.
#
# Variables: MULTIPART_PART_HEADERS:<part> holds the part's headers and
# ARGS:<part> the value of a non-file part. REQUEST_BODY stays empty for
# multipart bodies in libmodsecurity 3.
#
# Validated in our lab with OWASP CRS 4.30.0 (libmodsecurity 3.0.17), loaded
# as REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf.

# Primary: the method-override form field.
SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
    "id:2202611020,phase:2,deny,status:403,log,auditlog,msg:'ruby2shell CVE-2026-132825: Rack MethodOverride _method affected-charset case-map overflow attempt',tag:'CVE-2026-132825',tag:'GHSA-34m4-m9fh-gqp5',severity:'CRITICAL',chain"
    SecRule MULTIPART_PART_HEADERS:_method "@rx (?i)content-type\s*:\s*text/plain\s*(?:;[^;]*)*?;\s*charset\s*=\s*\"?(?:(?:windows-|cp)125[0247]|iso-?8859-(?:1|2|3|4|9|10|13|14|15|16))\b" \
        "chain"
        SecRule ARGS:_method "@rx (?:[^\xdf]*+\xdf){21}"

# Generic: any form field (application-level case conversion).
SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
    "id:2202611010,phase:2,deny,status:403,log,auditlog,msg:'ruby2shell CVE-2026-132825: multipart affected-charset part with sharp-s flood',tag:'CVE-2026-132825',tag:'GHSA-34m4-m9fh-gqp5',severity:'CRITICAL',chain"
    SecRule MULTIPART_PART_HEADERS "@rx (?i)content-type\s*:\s*text/plain\s*(?:;[^;]*)*?;\s*charset\s*=\s*\"?(?:(?:windows-|cp)125[0247]|iso-?8859-(?:1|2|3|4|9|10|13|14|15|16))\b" \
        "chain"
        SecRule ARGS "@rx (?:[^\xdf]*+\xdf){21}"

# The charset-declaring part header is the structural signal; legitimate
# Windows-1252 / ISO-8859 text/plain form parts are rare.
